<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Dashboard - Mental Well-Being</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="light">
    <header class="app-header">
       <h1 class="main-title">Mental Well-Being Check</h1>
        <div class="header-actions">
            <button class="btn-icon" onclick="toggleDarkMode()" title="Toggle Dark/Light Mode">🌙</button>
            <button class="btn-danger" onclick="handleLogout()">Logout</button>
        </div>
    </header>

    <main class="content-wrapper">
        <section class="quick-access-bar">
    <div class="resource-item" onclick="findNearbyClinics()">
        <div class="resource-icon">📍</div>
        <div class="resource-text">
            <strong>Nearby Clinics</strong>
            <span>Find psychiatrists in your area</span>
        </div>
    </div>

    <div class="resource-item helpline-highlight" onclick="window.location.href='tel:14416'">
        <div class="resource-icon">📞</div>
        <div class="resource-text">
            <strong>Tele-MANAS</strong>
            <span>24/7 Govt. Helpline (14416)</span>
        </div>
    </div>
</section>
        <section class="card status-check">
            <h2>Comprehensive Mental Health Evaluation</h2>
            <div class="progress-container">
    <div class="progress-info">
        <span>Assessment Progress</span>
        <span id="progress-text">0%</span>
    </div>
    <div class="progress-track">
        <div id="progress-fill" class="progress-fill"></div>
    </div>
</div>
            <p class="section-description">Please answer all 20 questions below. Your data is encrypted and secure.</p>
            
            <div id="questions-container" class="questions-grid">
                </div>

            <div class="assessment-actions">
                <button class="btn-primary" onclick="calculateComplexScore()">Analyze My Results</button>
            </div>
            
            <div id="result-display" class="status-result" style="display: none;">
                </div>
        </section>
    </main>

    <div class="ai-fab" onclick="goToChat()">
        <span class="fab-icon">🤖</span>
        <span class="fab-tooltip">Chat with AI Assistant</span>
    </div>
</div>
    <script type="module" src="script.js?v=1.0.1"></script>
    <button id="back-to-top" class="btn-top" onclick="window.scrollTo({top: 0, behavior: 'smooth'})" style="display: none;"></button>
</body>
</html>
